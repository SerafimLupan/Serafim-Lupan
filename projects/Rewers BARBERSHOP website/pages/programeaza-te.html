    <main>

        <section class="top-section-program">

            <div class="row">

                <div class="col-50">
    
                    <div class="card-program">
        
                        <form id="formular" class="formular" method="post" action="https://sheetdb.io/api/v1/zl8yhf5zcn0te">
        
                            <div class="group">
                                <input class="input-text" type="text" id="pronumele" name="data[pronumele]" pattern="[A-Z][a-z]{2,19}" title="Introduce proumele cu prima literă majusculă, exemplu: Mihai, apoi între 2 și 19 litere minuscule" required type="text" class="input">
                                <span class="highlight"></span>
                                <span class="bar"></span>
                                <label for="pronumele">Proumele</label>
                            </div>

                            <br/><br/>

                            <div class="group">
                                <input class="input-text" type="tel" id="telefon" name="data[telefon]" pattern="[+,0-9]{12}" title="Număr de telefon format din 12 caractere și cu +373 la început!" required type="text" class="input">
                                <span class="highlight"></span>
                                <span class="bar"></span>
                                <label for="telefon">Telefon</label>
                            </div>
        
                            <br/><br/>

                            <select id="barberul" name="data[barber]" required>
                                <option>Radu (Pro Barber)</option>                     
                                <option>Marina (Barber)</option>               
                            </select>

                            <br/><br/>

                            <input type="date" name="data[data-luna-anul]" id="data-luna-anul" required>
                            <label for="data-luna-anul"></label>

                            <br/><br/>

                            <input type="time" name="data[timp]" id="timp" min="08:00" max="22:00" required>
                            <label for="timp"></label>

                            <input id="submit" type="submit" value="Trimite">

                        </form>

                    </div>
    
                </div>

            </div>
    
        </section>
